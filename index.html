<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9edf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Garaż – koszty pojazdów</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Garaż">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface2:#f4f6f8; --ink:#18212b; --muted:#5e6b78; --line:#cbd3da;
  --accent:#f2b300; --accent-ink:#18212b; --danger:#b3261e; --ok:#2e7d4f; --eu:#1f4ea3;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12171c;--surface:#1a2128;--surface2:#212a32;--ink:#e6ebef;--muted:#95a2ae;--line:#2c3640;--danger:#ff8a80;--ok:#7bd19c;color-scheme:dark}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
.brand{font:700 26px/1 var(--cond);letter-spacing:.01em;margin-right:auto}
.brand small{display:block;font:500 13px/1.2 var(--sans);color:var(--muted);letter-spacing:0;margin-top:3px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500}
.ghost:hover{border-color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.err{background:var(--danger)} .dot.busy{background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}

/* plates */
.plates{display:flex;gap:12px;overflow-x:auto;padding:14px 2px 16px;scrollbar-width:thin}
.plate{flex:none;display:inline-flex;align-items:stretch;height:48px;padding:0;border:2px solid #20262c;border-radius:7px;background:#fff;color:#111;overflow:hidden;opacity:.5;transition:opacity .15s,transform .15s}
.plate:hover{opacity:.8}
.plate[aria-current="true"]{opacity:1;transform:translateY(-2px);box-shadow:0 4px 0 var(--accent)}
.plate .eu{width:22px;background:var(--eu);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 0 3px;font:600 10px/1 var(--sans)}
.plate .eu::before{content:"";width:11px;height:11px;border-radius:50%;border:2px dotted #ffd200}
.plate .t{display:flex;align-items:center;padding:0 14px;font:600 26px/1 var(--cond);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.plate.add{opacity:1;background:transparent;color:var(--ink);border:2px dashed var(--line)}
.plate.add .t{font-size:18px;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.plate.add:hover{border-color:var(--muted)}

/* vehicle head */
.vhead{display:grid;grid-template-columns:1fr minmax(260px,340px);gap:20px;align-items:start;margin-bottom:22px}
@media (max-width:720px){.vhead{grid-template-columns:1fr}}
.vtitle h1{font:700 44px/1 var(--cond);margin:4px 0 8px;letter-spacing:.01em;word-break:break-word}
.vmeta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:15px}
.vmeta b{color:var(--ink);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.linkbtn:hover{color:var(--ink)}
.vactions{display:flex;gap:16px;margin-top:12px}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.ledger table{width:100%;border-collapse:collapse}
.ledger td{padding:4px 0;font-size:15px}
.ledger td:last-child{text-align:right;white-space:nowrap}
.ledger tr.total td{border-top:2px solid var(--ink);padding-top:8px;font:700 24px/1.1 var(--cond)}
.ledger .sub td{color:var(--muted);font-size:13px;padding-top:0;white-space:normal;text-align:left}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 8px;font:600 19px/1 var(--cond);letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab.addcat{font:500 15px/1 var(--sans)}

.catbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 0 12px}
.catbar .sums{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:15px;margin-right:auto}
.catbar .sums b{color:var(--ink);font-weight:600}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.primary:hover{filter:brightness(1.05)}
.danger{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:9px 14px;font-weight:500}

/* entries */
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%;padding:0;display:block}
.card:hover{border-color:var(--muted)}
.vtop{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:12px 16px 8px}
.vtop .date{font:600 20px/1 var(--cond)}
.vtop .km{color:var(--muted)}
.vtop .amt{margin-left:auto;font:700 20px/1 var(--cond)}
.parts{list-style:none;margin:0;padding:0 16px}
.parts li{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:2px 14px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.parts .co{font-weight:600}
.parts .nm{min-width:0}
.parts .oem{grid-column:2;color:var(--muted);font-size:13px;white-space:pre-line}
.parts .pc{grid-column:3;grid-row:1;text-align:right;white-space:nowrap}
@media (max-width:560px){.parts li{grid-template-columns:1fr auto}.parts .nm,.parts .oem{grid-column:1}.parts .pc{grid-column:2;grid-row:1}}
.vfoot{display:flex;flex-wrap:wrap;gap:4px 20px;padding:8px 16px 12px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.vfoot b{color:var(--ink);font-weight:600}
.row{display:grid;grid-template-columns:92px 1fr auto;gap:2px 16px;align-items:baseline;padding:11px 16px}
.row .date{font:600 18px/1.2 var(--cond)}
.row .main{min-width:0}
.row .main .muted{display:block}
.row .amt{font:700 19px/1.2 var(--cond);text-align:right;white-space:nowrap}
.row .amt small{display:block;font:400 13px/1.3 var(--sans);color:var(--muted)}
.muted{color:var(--muted);font-size:14px}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .date{grid-column:1/-1}.top .ghost{padding:7px 10px;font-size:14px}.brand small{display:none}}
.ghost{white-space:nowrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}
.hero-empty{padding:50px 24px}
.hero-empty h2{font:700 30px/1.1 var(--cond);color:var(--ink);margin:0 0 8px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* dialog */
dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(780px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,14,18,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg header{display:flex;align-items:center;gap:10px;padding:16px 20px 6px}
.dlg header h3{font:700 26px/1.1 var(--cond);margin:0;margin-right:auto}
.x{background:none;border:0;font-size:26px;line-height:1;padding:4px 8px;color:var(--muted)}
.dlg .body{padding:8px 20px 16px;overflow:auto}
.dlg footer{display:flex;gap:10px;align-items:center;padding:12px 20px 16px;border-top:1px solid var(--line)}
.dlg footer .spacer{margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:9px 10px;color:var(--ink);font-size:16px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:42px}
.f.wide{grid-column:1/-1}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.hint a{color:inherit}
.prows{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.prow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) 34px;gap:8px;align-items:end;padding:10px;background:var(--surface2);border-radius:8px}
.prow .f input,.prow .f textarea{background:var(--surface)}
.prow .c-co{grid-column:1/span 2}.prow .rm{grid-column:7;grid-row:1}.prow .c-nm{grid-column:3/span 4;grid-row:1}
.prow .c-oem{grid-column:1/span 2}.prow .c-buy{grid-column:3/span 2}.prow .c-qty{grid-column:5}.prow .c-unit{grid-column:6/span 2}
@media (max-width:620px){.prow{grid-template-columns:1fr 1fr 34px}.prow .c-co{grid-column:1/3}.prow .rm{grid-column:3;grid-row:1}
 .prow .c-nm,.prow .c-oem,.prow .c-buy{grid-column:1/-1;grid-row:auto}.prow .c-qty{grid-column:1}.prow .c-unit{grid-column:2/-1}}
.ptot{grid-column:1/-1;text-align:right;font-size:14px;color:var(--muted)}.ptot:empty{display:none}.ptot b{color:var(--ink)}
.parts .pc small{display:block;color:var(--muted);font-size:13px}
.oct{display:inline-block;min-width:34px;text-align:center;border:1.5px solid var(--ink);border-radius:5px;padding:0 5px;margin-right:8px;font:600 14px/1.35 var(--cond)}
.octs{margin-top:12px}
.seg.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);align-self:stretch}
.seg.seg4 span{font-size:16px;padding:10px 8px;border-left:0;text-align:center;height:100%;display:flex;align-items:center;justify-content:center}
@media (max-width:560px){.seg.seg4{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stock{display:inline-block;margin-top:6px;border:1.5px solid var(--ok);color:var(--ok);background:none;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
.stock[aria-pressed="false"]{border-color:var(--muted);color:var(--muted)}
.card.gone .main,.card.gone .amt{opacity:.6}
div.card{cursor:pointer}
.grouph{font:600 18px/1 var(--cond);margin:10px 0 0;color:var(--muted)}
.note{padding:0 16px 12px;color:var(--muted);font-size:14px;white-space:pre-line;font-style:italic}
.note-in{display:block;color:var(--muted);font-size:14px;white-space:pre-line;font-style:italic}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
[hidden]{display:none!important}
.upcoming{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.upcoming h2{font:600 19px/1 var(--cond);margin:2px 0 6px}
.upcoming ul{list-style:none;margin:0;padding:0}
.uprow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;font-size:15px}
.upcoming li:first-child .uprow{border-top:0}
.upcoming p{margin:6px 0 0}
.sdot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line)}
.sdot.soon{background:var(--accent)} .sdot.over{background:var(--danger)}
.when{color:var(--muted)}
.card.plan{display:flex;align-items:center;gap:12px;padding:12px 16px;border-style:dashed;border-left:5px solid var(--line)}
.card.plan.soon{border-left-color:var(--accent)} .card.plan.over{border-left-color:var(--danger)}
.card.plan.over .when{color:var(--danger)}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pdot{align-self:center;flex:none;width:11px;height:11px;border-radius:50%;margin-right:12px;margin-left:-4px}
.pdot.soon{background:var(--accent)} .pdot.over{background:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:9px 20px;font:600 18px/1 var(--cond);color:var(--ink);background:var(--surface2);border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:-3px}
.rm{background:none;border:1px solid var(--line);border-radius:7px;height:42px;width:34px;color:var(--muted);font-size:18px}
.sectionlabel{font:600 18px/1 var(--cond);margin:18px 0 0;color:var(--ink)}
.calc{margin-top:12px;padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:15px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.menu button span{display:block;color:var(--muted);font-size:13px}
.menu button:hover{border-color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;z-index:99;max-width:calc(100vw - 32px)}
.status-line{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);border-radius:8px;margin-bottom:14px}
ol.steps{padding-left:20px;margin:8px 0 0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Garaż<small>koszty pojazdów</small></div>
    <button class="ghost sync" id="syncBtn"><span class="dot" id="syncDot"></span><span id="syncTxt">Tylko lokalnie</span></button>
    <button class="ghost" id="dataBtn">Excel / dane</button>
  </header>
  <nav class="plates" id="plates" aria-label="Pojazdy"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="fileXlsx" accept=".xlsx" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
// ===== CORE-START (czysta logika: dane, scalanie, obliczenia, eksport, import) =====
const FILE_NAME = 'garaz-koszty-pojazdow.json';
const TYPES = { service:'Serwis', fuel:'Paliwo', other:'Inne' };

function uid(){
  if (typeof crypto!=='undefined' && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,'').slice(0,14);
  return Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
function num(x){
  if (x===null || x===undefined || x==='') return null;
  if (typeof x==='number') return isFinite(x) ? x : null;
  const s = String(x).replace(/\s|\u00a0/g,'').replace(/km|zł|zl|l$/ig,'').replace(',','.');
  if (s==='') return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function str(v){ if (v===null || v===undefined) return ''; return String(v).trim(); }
// część: ilość × cena za sztukę (starsze wpisy miały tylko koszt łączny)
function partQty(p){ return p.qty!=null ? p.qty : 1; }
function partUnit(p){ return p.unit!=null ? p.unit : (p.cost!=null ? round2(p.cost/partQty(p)) : null); }
function partCost(p){ return p.unit!=null ? round2(partQty(p)*p.unit) : (p.cost!=null ? p.cost : null); }
function fuelOct(e){ return e.octane || 95; }
function alive(a){ return (a||[]).filter(x=>x && !x.del); }
function emptyState(){ return { v:1, vehicles:[] }; }
function round2(n){ return Math.round(n*100)/100; }

// Scalanie dwóch wersji danych (lokalnej i z gista) – rekord po rekordzie, wygrywa nowszy "u".
function mergeArr(a, b, keys){
  const cks = keys[0] ? [].concat(keys[0]) : [], rest = keys.slice(1);
  const order = [], map = new Map();
  for (const x of (a||[])) { if (!map.has(x.id)) order.push(x.id); map.set(x.id, x); }
  for (const y of (b||[])) {
    const x = map.get(y.id);
    if (!x) { order.push(y.id); map.set(y.id, y); continue; }
    const w = (y.u||0) > (x.u||0) ? y : x;
    const out = { ...w };
    for (const ck of cks) if (x[ck] || y[ck]) out[ck] = mergeArr(x[ck], y[ck], rest);
    map.set(y.id, out);
  }
  return order.map(id=>map.get(id));
}
function mergeState(a, b){
  return { v:1, vehicles: mergeArr(a && a.vehicles, b && b.vehicles, ['cats',['entries','plans']]) };
}

function newVehicle(name){
  const t = Date.now();
  return { id:uid(), u:t, name, cats:[
    { id:uid(), u:t, name:'Serwis', type:'service', entries:[] },
    { id:uid(), u:t, name:'Paliwo', type:'fuel', entries:[] },
    { id:uid(), u:t, name:'Inne', type:'other', entries:[] },
  ]};
}

// --- obliczenia ---
function byDateAsc(x,y){ return (x.date||'').localeCompare(y.date||'') || ((x.km??0)-(y.km??0)); }
function fuelRows(entries){
  const list = alive(entries).slice().sort((x,y)=>{
    if (x.km!=null && y.km!=null && x.km!==y.km) return x.km-y.km;
    return (x.date||'').localeCompare(y.date||'');
  });
  let prev = null;
  return list.map(e=>{
    const diff = (prev && e.km!=null && prev.km!=null) ? e.km-prev.km : null;
    const cost = (e.liters!=null && e.price!=null) ? e.liters*e.price : null;
    const cons = (diff>0 && e.liters>0) ? e.liters/diff*100 : null;
    prev = e;
    return { e, diff, cost, cons };
  });
}
// rodzaje kosztów w kategoriach typu "Inne"
const KINDS = { czesci:'Części', serwis:'Serwis', myjnia:'Myjnia i pielęgnacja', kosmetyki:'Kosmetyki' };
const CARE_RE = /myjni|mycie|myjk|detailing|ceramik|wosk|polerow|pranie|odkurz|pielęgn|kosmetyk/i;
function guessKind(e){ return CARE_RE.test((e.co||'')+' '+(e.name||'')) ? 'myjnia' : null; }
function okind(e){
  if (e.kind && KINDS[e.kind]) return e.kind;
  const g = guessKind(e); if (g) return g;
  return (e.service!=null && !e.cost) ? 'serwis' : 'czesci';
}
function oamt(e){
  if (e.amount!=null || e.kind) return e.amount;
  return (e.cost==null && e.service==null) ? null : (e.cost||0)+(e.service||0);
}
function kindFromLabel(s){ const t=str(s).toLowerCase(); if(!t) return null; for (const [k,l] of Object.entries(KINDS)) if (l.toLowerCase()===t || t.startsWith(l.toLowerCase().slice(0,5))) return k; return null; }
function emptyK(){ return { czesci:0, serwis:0, myjnia:0, kosmetyki:0 }; }
function catTotals(cat){
  const es = alive(cat.entries), k = emptyK();
  if (cat.type==='service') {
    for (const v of es) { k.serwis += v.labor||0; for (const p of (v.parts||[])) k.czesci += partCost(p)||0; }
    return { k, total:k.czesci+k.serwis, count:es.length };
  }
  if (cat.type==='fuel') {
    const rows = fuelRows(es);
    let cost=0, liters=0, cl=0, ck=0;
    for (const r of rows) {
      cost += r.cost||0; liters += r.e.liters||0;
      if (r.diff>0) { ck += r.diff; cl += r.e.liters||0; }
    }
    k.czesci = cost;
    return { k, total:cost, liters, avg: ck>0 ? cl/ck*100 : null, count:rows.length };
  }
  let stock=0;
  for (const e of es) { k[okind(e)] += oamt(e)||0; if (okind(e)==='kosmetyki' && e.inStock!==false) stock++; }
  return { k, total:k.czesci+k.serwis+k.myjnia+k.kosmetyki, stock, count:es.length };
}
function vehicleStats(v){
  let total=0, maxKm=null, avg=null;
  for (const c of alive(v.cats)) {
    const t = catTotals(c); total += t.total;
    if (c.type==='fuel' && t.avg!=null && avg==null) avg = t.avg;
    for (const e of alive(c.entries)) if (e.km!=null && (maxKm==null || e.km>maxKm)) maxKm = e.km;
  }
  return { total, maxKm, avg };
}

// --- plany (coś do zrobienia przy dacie lub przebiegu) ---
function daysBetween(a,b){ return Math.round((Date.UTC(...b.split('-').map((x,i)=>i===1?x-1:+x)) - Date.UTC(...a.split('-').map((x,i)=>i===1?x-1:+x)))/86400000); }
function planStatus(pl, curKm, todayISO){
  const days = pl.dueDate ? daysBetween(todayISO, pl.dueDate) : null;
  const kmLeft = (pl.dueKm!=null && curKm!=null) ? pl.dueKm-curKm : null;
  const over = (days!=null && days<0) || (kmLeft!=null && kmLeft<=0);
  const soon = !over && ((days!=null && days<=14) || (kmLeft!=null && kmLeft<=1000));
  const score = Math.min(days!=null?days:1e9, kmLeft!=null?kmLeft/40:1e9);
  return { days, kmLeft, level: over?'over':soon?'soon':'ok', rank: over?0:soon?1:2, score };
}
function activePlans(v, todayISO){
  const curKm = vehicleStats(v).maxKm, out=[];
  for (const c of alive(v.cats)) for (const pl of alive(c.plans)) if (!pl.done) out.push({ pl, cat:c, st:planStatus(pl,curKm,todayISO) });
  return out.sort((a,b)=>a.st.rank-b.st.rank || a.st.score-b.st.score);
}

// --- eksport: opis arkusza niezależny od biblioteki ---
function colL(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; }
function sheetNameSafe(s, used){
  let n = s.replace(/[\[\]:*?\/\\]/g,' ').replace(/\s+/g,' ').trim().slice(0,31) || 'Arkusz';
  let base=n, k=2;
  while (used.has(n.toLowerCase())) { const suf=' ('+(k++)+')'; n = base.slice(0,31-suf.length)+suf; }
  used.add(n.toLowerCase());
  return n;
}
function qsheet(n){ return "'"+n.replace(/'/g,"''")+"'"; }
const FMT = { date:'yyyy-mm-dd', pln:'#,##0.00 "zł"', km:'0 "km"', lit:'0.00', cons:'0.0', l100:'0.0 "l/100km"' };
const HEAD = { b:true, fill:'FFE9EDF0' };

function buildSpec(state, todayISO){
  const used = new Set(['podsumowanie','zaplanowane']);
  const sheets = [];
  const summaryRows = [];
  for (const v of alive(state.vehicles)) {
    for (const c of alive(v.cats)) {
      const name = sheetNameSafe(v.name+' - '+c.name, used);
      const sh = c.type==='service' ? serviceSheet(c) : c.type==='fuel' ? fuelSheet(c) : otherSheet(c);
      sh.name = name;
      sheets.push(sh);
      summaryRows.push({ veh:v.name, cat:c.name, sheet:name, refs:sh.refs, vals:sh.vals });
    }
  }
  sheets.unshift(summarySheet(summaryRows));
  const ps = plansSheet(state, todayISO || new Date().toISOString().slice(0,10));
  if (ps) sheets.splice(1,0,ps);
  return sheets;
}
function plansSheet(state, todayISO){
  const rows=[]; let r=1;
  ['Pojazd','Kategoria','Co zrobić','Termin (data)','Termin (przebieg)','Status','Notatki'].forEach((h,i)=>setCell(rows,0,i,{v:h,...HEAD}));
  for (const v of alive(state.vehicles)) for (const x of activePlans(v, todayISO)) {
    const pl=x.pl;
    setCell(rows,r,0,{v:v.name}); setCell(rows,r,1,{v:x.cat.name}); setCell(rows,r,2,{v:pl.title||'',wrap:true});
    if (pl.dueDate) setCell(rows,r,3,dateCell(pl.dueDate));
    if (pl.dueKm!=null) setCell(rows,r,4,{v:pl.dueKm,fmt:FMT.km});
    setCell(rows,r,5,{v:x.st.level==='over'?'po terminie':x.st.level==='soon'?'wkrótce':'zaplanowane'});
    if (pl.note) setCell(rows,r,6,{v:pl.note,wrap:true});
    r++;
  }
  if (r===1) return null;
  return { name:'Zaplanowane', rows, merges:[], widths:[16,18,34,14,16,14,34] };
}
function setCell(rows, r, c, cell){ while (rows.length<=r) rows.push([]); rows[r][c]=cell; }
function dateCell(d){ return d ? { v:d, t:'date', fmt:FMT.date } : null; }

function serviceSheet(cat){
  const rows=[], merges=[];
  ['Data','Przebieg','Co','Nazwa','Kod części OEM','Data zakupu','Ilość','Cena za szt.','Koszt','Serwis koszt','Wymiana czas (własny)','Notatki']
    .forEach((h,i)=>setCell(rows,0,i,{v:h,...HEAD}));
  const visits = alive(cat.entries).slice().sort(byDateAsc);
  let r=1, partsSum=0, laborSum=0;
  for (const v of visits) {
    const parts = v.parts||[];
    const n = Math.max(1, parts.length);
    for (let i=0;i<n;i++) {
      setCell(rows, r+i, 0, null);
      if (i===0) {
        setCell(rows,r,0,dateCell(v.date));
        if (v.km!=null) setCell(rows,r,1,{v:v.km,fmt:FMT.km});
        if (v.labor!=null) { setCell(rows,r,9,{v:v.labor,fmt:FMT.pln}); laborSum+=v.labor; }
        if (v.time) setCell(rows,r,10,{v:v.time});
        if (v.note) setCell(rows,r,11,{v:v.note,wrap:true});
      }
      const p = parts[i];
      if (p) {
        if (p.co) setCell(rows,r+i,2,{v:p.co});
        if (p.name) setCell(rows,r+i,3,{v:p.name,wrap:true});
        if (p.oem) setCell(rows,r+i,4,{v:p.oem,wrap:true});
        const R=r+i+1, q=partQty(p), un=partUnit(p), pc=partCost(p);
        if (p.bought) setCell(rows,r+i,5,dateCell(p.bought));
        setCell(rows,r+i,6,{v:q});
        if (un!=null) setCell(rows,r+i,7,{v:un,fmt:FMT.pln});
        setCell(rows,r+i,8,{f:`IF(OR(G${R}="",H${R}=""),"",G${R}*H${R})`,r:pc==null?'':pc,fmt:FMT.pln});
        partsSum+=pc||0;
      }
    }
    if (n>1) for (const col of [0,1,9,10,11]) merges.push(colL(col)+(r+1)+':'+colL(col)+(r+n));
    r += n;
  }
  setCell(rows,0,13,{v:'PODSUMOWANIE KOSZTÓW',...HEAD});
  setCell(rows,1,13,{v:'Części:'}); setCell(rows,1,14,{f:'SUM(I:I)',r:round2(partsSum),fmt:FMT.pln});
  setCell(rows,2,13,{v:'Serwis:'}); setCell(rows,2,14,{f:'SUM(J:J)',r:round2(laborSum),fmt:FMT.pln});
  setCell(rows,3,13,{v:'Razem:',b:true}); setCell(rows,3,14,{f:'O2+O3',r:round2(partsSum+laborSum),fmt:FMT.pln,b:true});
  return { rows, merges, widths:[11,12,27,46,18,12,7,12,12,13,18.5,30,4,24,14],
    refs:{czesci:'O2',serwis:'O3'}, vals:{czesci:partsSum,serwis:laborSum} };
}
function fuelSheet(cat){
  const rows=[];
  ['Data','Przebieg','Różnica kilometrów','Ilość litrów','Cena za litr','Koszt','Spalanie obliczone','Spalanie z komputera','Oktany','Notatki']
    .forEach((h,i)=>setCell(rows,0,i,{v:h,...HEAD}));
  const list = fuelRows(cat.entries);
  let r=1, sum=0, lit=0, cl=0, ck=0;
  list.forEach((x,i)=>{
    const R=r+1, e=x.e;
    setCell(rows,r,0,dateCell(e.date));
    if (e.km!=null) setCell(rows,r,1,{v:e.km});
    if (i>0) setCell(rows,r,2,{f:`IF(OR(B${R}="",B${R-1}=""),"",B${R}-B${R-1})`,r:x.diff==null?'':x.diff});
    if (e.liters!=null) { setCell(rows,r,3,{v:e.liters,fmt:FMT.lit}); lit+=e.liters; }
    if (e.price!=null) setCell(rows,r,4,{v:e.price,fmt:FMT.pln});
    setCell(rows,r,5,{f:`IF(OR(D${R}="",E${R}=""),"",D${R}*E${R})`,r:x.cost==null?'':round2(x.cost),fmt:FMT.pln});
    if (i>0) setCell(rows,r,6,{f:`IF(AND(N(C${R})>0,N(D${R})>0),D${R}/C${R}*100,"")`,r:x.cons==null?'':Math.round(x.cons*1000)/1000,fmt:FMT.cons});
    if (e.computer!=null) setCell(rows,r,7,{v:e.computer,fmt:FMT.cons});
    if (e.liters!=null) setCell(rows,r,8,{v:fuelOct(e)});
    if (e.note) setCell(rows,r,9,{v:e.note,wrap:true});
    sum += x.cost||0;
    if (x.diff>0) { ck+=x.diff; cl+=e.liters||0; }
    r++;
  });
  setCell(rows,0,11,{v:'PODSUMOWANIE KOSZTÓW',...HEAD});
  setCell(rows,1,11,{v:'Paliwo:'}); setCell(rows,1,12,{f:'SUM(F:F)',r:round2(sum),fmt:FMT.pln});
  setCell(rows,2,11,{v:'Litry:'}); setCell(rows,2,12,{f:'SUM(D:D)',r:round2(lit),fmt:FMT.lit});
  setCell(rows,3,11,{v:'Śr. spalanie:'}); setCell(rows,3,12,{f:'IFERROR(SUMIF(C:C,">0",D:D)/SUMIF(C:C,">0")*100,"")',r:ck>0?Math.round(cl/ck*100000)/1000:'',fmt:FMT.l100});
  return { rows, merges:[], widths:[11,10,17,11,11,13,17,19,8,30,4,24,14], refs:{czesci:'M2'}, vals:{czesci:sum} };
}
function otherSheet(cat){
  const rows=[];
  ['Data','Co','Nazwa','Rodzaj','Koszt','Na stanie','Notatki'].forEach((h,i)=>setCell(rows,0,i,{v:h,...HEAD}));
  const list = alive(cat.entries).slice().sort(byDateAsc);
  let r=1; const k=emptyK();
  for (const e of list) {
    const kd=okind(e), am=oamt(e);
    setCell(rows,r,0,dateCell(e.date));
    if (e.co) setCell(rows,r,1,{v:e.co});
    if (e.name) setCell(rows,r,2,{v:e.name,wrap:true});
    setCell(rows,r,3,{v:KINDS[kd]});
    if (am!=null) { setCell(rows,r,4,{v:am,fmt:FMT.pln}); k[kd]+=am; }
    if (kd==='kosmetyki') setCell(rows,r,5,{v:e.inStock===false?'nie':'tak'});
    if (e.note) setCell(rows,r,6,{v:e.note,wrap:true});
    r++;
  }
  setCell(rows,0,8,{v:'PODSUMOWANIE KOSZTÓW',...HEAD});
  const refs={}, keys=Object.keys(KINDS);
  keys.forEach((kd,i)=>{
    setCell(rows,i+1,8,{v:KINDS[kd]+':'});
    setCell(rows,i+1,9,{f:`SUMIF(D:D,"${KINDS[kd]}",E:E)`,r:round2(k[kd]),fmt:FMT.pln});
    refs[kd]='J'+(i+2);
  });
  const tot=k.czesci+k.serwis+k.myjnia+k.kosmetyki;
  setCell(rows,keys.length+1,8,{v:'Razem:',b:true}); setCell(rows,keys.length+1,9,{f:`SUM(J2:J${keys.length+1})`,r:round2(tot),fmt:FMT.pln,b:true});
  return { rows, merges:[], widths:[11,24,34,20,12,10,30,4,22,14], refs, vals:k };
}
function summarySheet(list){
  const rows=[];
  const keys=Object.keys(KINDS);
  ['Pojazd','Kategoria','Części / paliwo','Serwis','Myjnia i pielęgnacja','Kosmetyki','Razem'].forEach((h,i)=>setCell(rows,0,i,{v:h,...HEAD}));
  let r=1;
  const vehTotals = new Map();
  for (const s of list) {
    const R=r+1; let t=0;
    setCell(rows,r,0,{v:s.veh}); setCell(rows,r,1,{v:s.cat});
    keys.forEach((kd,i)=>{
      const val=(s.vals&&s.vals[kd])||0; t+=val;
      if (s.refs[kd]) setCell(rows,r,2+i,{f:qsheet(s.sheet)+'!'+s.refs[kd],r:round2(val),fmt:FMT.pln});
      else setCell(rows,r,2+i,{v:0,fmt:FMT.pln});
    });
    setCell(rows,r,6,{f:`SUM(C${R}:F${R})`,r:round2(t),fmt:FMT.pln});
    vehTotals.set(s.veh,(vehTotals.get(s.veh)||0)+t);
    r++;
  }
  setCell(rows,0,8,{v:'Pojazd',...HEAD}); setCell(rows,0,9,{v:'Razem',...HEAD});
  let i=1, all=0;
  for (const [veh,t] of vehTotals) {
    setCell(rows,i,8,{v:veh}); setCell(rows,i,9,{f:`SUMIF(A:A,I${i+1},G:G)`,r:round2(t),fmt:FMT.pln});
    all+=t; i++;
  }
  setCell(rows,i,8,{v:'Wszystkie pojazdy',b:true}); setCell(rows,i,9,{f:`SUM(J2:J${i})`,r:round2(all),fmt:FMT.pln,b:true});
  return { name:'Podsumowanie', rows, merges:[], widths:[18,20,16,14,20,14,14,4,20,16] };
}

// --- import z arkusza: działa na prostej "siatce" komórek ---
// sheet = {name, rows, cols, cell(r,c) -> {v (własna wartość), mv (wartość z komórki scalonej), slave, master}}
function toISO(v){
  if (v===null || v===undefined || v==='') return '';
  if (v instanceof Date) return v.getUTCFullYear()+'-'+String(v.getUTCMonth()+1).padStart(2,'0')+'-'+String(v.getUTCDate()).padStart(2,'0');
  if (typeof v==='number') return toISO(new Date(Math.round((v-25569)*86400000)));
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);
  if (m) { const y = m[3].length===2 ? '20'+m[3] : m[3]; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
  return '';
}
function parseSheets(sheets){
  const out=[];
  for (const sh of sheets) {
    const nm = sh.name.trim();
    const k = nm.indexOf(' - ');
    let veh = k>0 ? nm.slice(0,k).trim() : nm, catName = k>0 ? nm.slice(k+3).trim() : 'Inne';
    if (['podsumowanie','zaplanowane'].includes(veh.toLowerCase())) continue;
    const hdr=[];
    for (let c=1;c<=Math.min(sh.cols,40);c++) hdr[c]=str(sh.cell(1,c).v).toLowerCase();
    const find = pred => { for (let c=1;c<hdr.length;c++) if (hdr[c] && !hdr[c].includes('podsumowanie') && pred(hdr[c])) return c; return 0; };
    const col = { date:find(h=>h==='data'), km:find(h=>h.startsWith('przebieg')) };
    const has = s => hdr.some(h=>h && h.includes(s));
    let type, entries=[];
    const t = Date.now();
    const get = (r,c,useMaster)=>{ if(!c) return null; const x=sh.cell(r,c); const v = useMaster ? x.mv : x.v; return (v===''||v===undefined)?null:v; };
    if (has('litr')) {
      type='fuel';
      col.l=find(h=>h.includes('litr')&&!h.includes('cena')); col.p=find(h=>h.includes('cena')); col.pc=find(h=>h.includes('komputer')); col.oct=find(h=>h.includes('oktan')); col.note=find(h=>h.startsWith('notat')||h.startsWith('uwag'));
      for (let r=2;r<=sh.rows;r++) {
        const km=num(get(r,col.km)), l=num(get(r,col.l));
        if (km==null && l==null) continue;
        entries.push({ id:uid(), u:t, date:toISO(get(r,col.date)), km, liters:l, price:num(get(r,col.p)), computer:num(get(r,col.pc)), octane:[95,98,100].includes(num(get(r,col.oct)))?num(get(r,col.oct)):95, note:str(get(r,col.note)) });
      }
    } else if (col.km && (has('kod') || hdr.includes('co'))) {
      type='service';
      col.co=find(h=>h==='co'); col.nm=find(h=>h==='nazwa'); col.oem=find(h=>h.includes('kod'));
      col.qty=find(h=>h.startsWith('ilo')); col.buy=find(h=>h.includes('zakup')); col.unit=find(h=>h.includes('cena')); col.cost=find(h=>h==='koszt'); col.lab=find(h=>h.includes('koszt')&&h!=='koszt'); col.time=find(h=>h.includes('czas')); col.note=find(h=>h.startsWith('notat')||h.startsWith('uwag'));
      let cur=null;
      for (let r=2;r<=sh.rows;r++) {
        const A = col.date ? sh.cell(r,col.date) : {v:null,mv:null,slave:false,master:false};
        const own = [col.co,col.nm,col.oem,col.cost,col.unit].some(c=>get(r,c)!=null);
        const lab = num(get(r,col.lab));
        const startsNew = !A.slave && (A.v!=null && A.v!=='' || A.master);
        if (!startsNew && !own && lab==null) continue;
        if (startsNew || !cur) {
          cur = { id:uid(), u:t, date:toISO(A.v ?? A.mv), km:num(get(r,col.km,true)), labor:null, time:'', note:'', parts:[] };
          entries.push(cur);
        }
        if (lab!=null) cur.labor = round2((cur.labor||0)+lab);
        const tm = str(get(r,col.time)); if (tm && !cur.time) cur.time = tm;
        const nt = str(get(r,col.note)); if (nt && !cur.note) cur.note = nt;
        if (own) {
          let oem = get(r,col.oem,true); if (typeof oem==='number' && Number.isInteger(oem)) oem=String(oem);
          const qty = num(get(r,col.qty)) || 1, cost = num(get(r,col.cost));
          let unit = num(get(r,col.unit)); if (unit==null && cost!=null) unit = round2(cost/qty);
          const part = { co:str(get(r,col.co,true)), name:str(get(r,col.nm,true)), oem:str(oem), qty, unit, cost: unit!=null ? round2(qty*unit) : cost };
          const bd = toISO(get(r,col.buy)); if (bd) part.bought = bd;
          cur.parts.push(part);
        }
      }
    } else {
      type='other';
      col.co=find(h=>h==='co'); col.nm=find(h=>h==='nazwa');
      col.cost=find(h=>h==='koszt'); col.srv=find(h=>h.includes('koszt')&&h!=='koszt');
      col.kind=find(h=>h==='rodzaj'); col.stock=find(h=>h.includes('stanie')); col.note=find(h=>h.startsWith('notat')||h.startsWith('uwag'));
      for (let r=2;r<=sh.rows;r++) {
        const old={ co:str(get(r,col.co)), name:str(get(r,col.nm)), cost:num(get(r,col.cost)), service:num(get(r,col.srv)) };
        const note=str(get(r,col.note));
        if (!old.co && !old.name && old.cost==null && old.service==null && !note) continue;
        const kind = kindFromLabel(get(r,col.kind)) || okind(old);
        const st = str(get(r,col.stock)).toLowerCase();
        const e={ id:uid(), u:t, date:toISO(get(r,col.date)), co:old.co, name:old.name, kind, amount:oamt(old), note };
        if (kind==='kosmetyki') e.inStock = !(st==='nie' || st==='0' || st.startsWith('skoń') || st.startsWith('skon'));
        entries.push(e);
      }
    }
    out.push({ vehicle:veh, cat:catName, type, entries });
  }
  return out;
}
// ===== CORE-END =====
</script>

<script>
// ===== UI =====
const LS_DATA='garaz.data', LS_CFG='garaz.cfg', LS_UI='garaz.ui';
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zl = n => (n==null||n==='') ? '–' : Number(n).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+'\u00a0zł';
const kmf = n => n==null ? '' : Number(n).toLocaleString('pl-PL')+'\u00a0km';
const dec = (n,d=1) => n==null ? '–' : Number(n).toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d});
const dshow = d => { if(!d) return 'bez daty'; const [y,m,dd]=d.split('-'); return `${+dd}.${m}.${y}`; };
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

function readJSON(k, def){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function writeJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('Nie udało się zapisać na urządzeniu: '+e.message); } }

let state = readJSON(LS_DATA, emptyState());
let cfg = readJSON(LS_CFG, {});
let ui = readJSON(LS_UI, {});

function touch(o){ o.u = Date.now(); return o; }
function commit(){ writeJSON(LS_DATA, state); render(); scheduleSync(); }
function saveUI(){ writeJSON(LS_UI, ui); }

function curVehicle(){ const vs=alive(state.vehicles); return vs.find(v=>v.id===ui.v) || vs[0] || null; }
function curCat(v){ const cs=alive(v.cats); return cs.find(c=>c.id===ui.c) || cs[0] || null; }

let toastT;
function toast(msg){
  let el = $('.toast'); if (!el) { el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true, 3200);
}

// ---------- render ----------
function dueText(pl, st){
  const p=[];
  if (pl.dueDate) p.push(`${dshow(pl.dueDate)} <span class="when">(${st.days<0?`${-st.days} dni po terminie`:st.days===0?'dziś':st.days===1?'jutro':`za ${st.days} dni`})</span>`);
  if (pl.dueKm!=null) p.push(`przy ${kmf(pl.dueKm)}${st.kmLeft!=null?` <span class="when">(${st.kmLeft<=0?`${(-st.kmLeft).toLocaleString('pl-PL')} km po terminie`:`za ${st.kmLeft.toLocaleString('pl-PL')} km`})</span>`:''}`);
  return p.join(' lub ') || 'bez terminu';
}
function upcomingBox(v){
  const list = activePlans(v, today());
  if (!list.length) return '';
  return `<div class="upcoming"><h2>Do zrobienia</h2><ul>${list.slice(0,4).map(x=>`<li><button class="uprow" data-gocat="${x.cat.id}"><span class="sdot ${x.st.level}"></span><span><b>${esc(x.pl.title)}</b> <span class="muted">${esc(x.cat.name)}</span><br><span class="muted">${dueText(x.pl,x.st)}</span></span></button></li>`).join('')}</ul>${list.length>4?`<p class="muted">i jeszcze ${list.length-4}</p>`:''}</div>`;
}
function renderPlans(v,c){
  const curKm=vehicleStats(v).maxKm;
  const list = alive(c.plans).filter(p=>!p.done).map(pl=>({pl,st:planStatus(pl,curKm,today())})).sort((a,b)=>a.st.rank-b.st.rank||a.st.score-b.st.score);
  if (!list.length) return '';
  return `<h3 class="grouph">Zaplanowane</h3>`+list.map(({pl,st})=>`<div class="card plan ${st.level}" role="button" tabindex="0" data-plan="${pl.id}">
      <div class="pmain"><b>${esc(pl.title)}</b><span class="muted">${dueText(pl,st)}</span>${pl.note?`<span class="note-in">${esc(pl.note)}</span>`:''}</div>
      <button type="button" class="ghost" data-plandone="${pl.id}">Zrobione</button></div>`).join('') + `<h3 class="grouph">Historia</h3>`;
}
function kindLine(t){
  const p = Object.entries(t.k).filter(([,val])=>val).map(([kk,val])=>`${KINDS[kk].toLowerCase()} ${zl(val)}`);
  return p.length>1 ? `<tr class="sub"><td colspan="2">${p.join(', ')}</td></tr>` : '';
}
function render(){
  const vs = alive(state.vehicles), v = curVehicle();
  $('#plates').innerHTML = vs.map(x=>`<button class="plate" data-veh="${x.id}" aria-current="${v&&x.id===v.id}"><span class="eu">PL</span><span class="t">${esc(x.name)}</span>${(()=>{ const a=activePlans(x,today())[0]; return a&&a.st.level!=='ok'?`<span class="pdot ${a.st.level}" title="Zaplanowane zadania wymagają uwagi"></span>`:''; })()}</button>`).join('')
    + `<button class="plate add" id="addVeh"><span class="t">+ Dodaj auto</span></button>`;
  const main = $('#main');
  if (!v) {
    main.innerHTML = `<div class="empty hero-empty"><h2>Pusty garaż</h2><p>Dodaj pierwsze auto albo wczytaj swój dotychczasowy arkusz Excela.</p>
      <div class="btnrow"><button class="primary" data-act="addVeh">Dodaj auto</button><button class="ghost" data-act="importX">Wczytaj arkusz .xlsx</button></div></div>`;
    return;
  }
  const st = vehicleStats(v), cats = alive(v.cats), c = curCat(v);
  const ledgerRows = cats.map(k=>{ const t=catTotals(k); return `<tr><td>${esc(k.name)}</td><td>${zl(t.total)}</td></tr>`+
     (k.type!=='fuel' ? kindLine(t) : ''); }).join('');
  let html = `<section class="vhead">
    <div class="vtitle"><h1>${esc(v.name)}</h1>
      <div class="vmeta">${st.maxKm!=null?`<span>Ostatni przebieg <b>${kmf(st.maxKm)}</b></span>`:''}${st.avg!=null?`<span>Średnie spalanie <b>${dec(st.avg)} l/100 km</b></span>`:''}</div>
      ${upcomingBox(v)}
      <div class="vactions"><button class="linkbtn" data-act="editVeh">Zmień nazwę lub usuń auto</button></div>
    </div>
    <div class="ledger"><table>${ledgerRows}<tr class="total"><td>Razem</td><td>${zl(st.total)}</td></tr></table></div>
  </section>
  <div class="tabs" role="tablist">${cats.map(k=>`<button class="tab" role="tab" data-cat="${k.id}" aria-selected="${c&&k.id===c.id}">${esc(k.name)}</button>`).join('')}
    <button class="tab addcat" data-act="addCat">+ Kategoria</button></div>`;
  if (c) {
    const t = catTotals(c);
    const sums = c.type==='service' ? `<span>Części <b>${zl(t.k.czesci)}</b></span><span>Serwis <b>${zl(t.k.serwis)}</b></span>`
      : c.type==='fuel' ? `<span>Paliwo <b>${zl(t.k.czesci)}</b></span><span>Zatankowano <b>${dec(t.liters,2)} l</b></span>${t.avg!=null?`<span>Śr. spalanie <b>${dec(t.avg)} l/100 km</b></span>`:''}`
      : Object.keys(KINDS).filter(kk=>t.k[kk]).map(kk=>`<span>${KINDS[kk]} <b>${zl(t.k[kk])}</b></span>`).join('') + (t.stock?`<span>Kosmetyki na stanie <b>${t.stock}</b></span>`:'') || '<span>Brak kosztów</span>';
    html += `<div class="catbar"><div class="sums">${sums}</div><button class="linkbtn" data-act="editCat">Edytuj kategorię</button>${c.type!=='fuel'?`<button class="ghost" data-act="addPlan">Zaplanuj</button>`:''}<button class="primary" data-act="addEntry">${c.type==='fuel'?'Dodaj tankowanie':c.type==='service'?'Dodaj serwis':'Dodaj wpis'}</button></div>`;
    if (c.type==='other') {
      const f = KINDS[ui.k] ? ui.k : 'all';
      html += `<div class="chips" role="group" aria-label="Rodzaj kosztu">${[['all','Wszystko'],...Object.entries(KINDS)].map(([kk,l])=>`<button class="chip" data-kind="${kk}" aria-pressed="${f===kk}">${l}</button>`).join('')}</div>`;
    }
    html += `<div class="list">${c.type!=='fuel'?renderPlans(v,c):''}${renderEntries(c)}</div>`;
  } else {
    html += `<div class="empty" style="margin-top:16px"><p>To auto nie ma jeszcze kategorii kosztów.</p><button class="primary" data-act="addCat">Dodaj kategorię</button></div>`;
  }
  main.innerHTML = html;
}

function renderEntries(c){
  const es = alive(c.entries);
  if (!es.length) return `<div class="empty"><p>Brak wpisów w tej kategorii.</p></div>`;
  if (c.type==='service') {
    return es.slice().sort((a,b)=>byDateAsc(b,a)).map(v=>{
      const parts = v.parts||[]; const ps = parts.reduce((s,p)=>s+(partCost(p)||0),0);
      return `<button class="card" data-entry="${v.id}">
        <div class="vtop"><span class="date">${dshow(v.date)}</span>${v.km!=null?`<span class="km">${kmf(v.km)}</span>`:''}<span class="amt">${zl(ps+(v.labor||0))}</span></div>
        ${parts.length?`<ul class="parts">${parts.map(p=>`<li><span class="co">${esc(p.co||'—')}</span><span class="nm">${esc(p.name)}</span>${p.oem?`<span class="oem">${esc(p.oem)}</span>`:''}${p.bought?`<span class="oem">kupione ${dshow(p.bought)}</span>`:''}<span class="pc">${partCost(p)!=null?zl(partCost(p)):''}${partQty(p)!==1&&partUnit(p)!=null?`<small>${dec(partQty(p),partQty(p)%1?2:0)} × ${zl(partUnit(p))}</small>`:''}</span></li>`).join('')}</ul>`:''}
        <div class="vfoot"><span>Części <b>${zl(ps)}</b></span><span>Serwis <b>${zl(v.labor||0)}</b></span>${v.time?`<span>Czas własny <b>${esc(v.time)}</b></span>`:''}</div>${v.note?`<div class="note">${esc(v.note)}</div>`:''}
      </button>`; }).join('');
  }
  if (c.type==='fuel') {
    return fuelRows(es).reverse().map(x=>{ const e=x.e;
      const base = e.liters==null;
      return `<button class="card row" data-entry="${e.id}">
        <span class="date">${dshow(e.date)}</span>
        <span class="main">${base?'Stan licznika':`<span class="oct">${fuelOct(e)}</span>${dec(e.liters,2)} l × ${zl(e.price)}`}<span class="muted">${kmf(e.km)}${x.diff!=null?` (+${x.diff.toLocaleString('pl-PL')} km)`:''}</span>${e.note?`<span class="note-in">${esc(e.note)}</span>`:''}</span>
        <span class="amt">${base?'':zl(x.cost)}<small>${x.cons!=null?`${dec(x.cons)} l/100 km`:''}${e.computer!=null?`<br>komputer ${dec(e.computer)}`:''}</small></span>
      </button>`; }).join('');
  }
  const f = KINDS[ui.k] ? ui.k : 'all';
  let list = es.filter(e=>f==='all' || okind(e)===f).sort((a,b)=>byDateAsc(b,a));
  if (!list.length) return `<div class="empty"><p>Brak wpisów tego rodzaju.</p></div>`;
  const rowH = e=>{ const kd=okind(e), cos=kd==='kosmetyki', out=cos && e.inStock===false;
    return `<div class="card row${out?' gone':''}" role="button" tabindex="0" data-entry="${e.id}">
      <span class="date">${dshow(e.date)}</span>
      <span class="main">${esc(e.co||'—')}${e.name?`<span class="muted">${esc(e.name)}</span>`:''}${e.note?`<span class="note-in">${esc(e.note)}</span>`:''}
        ${cos?`<button type="button" class="stock" data-stock="${e.id}" aria-pressed="${!out}" title="Kliknij, aby zmienić">${out?'Skończony':'Na stanie'}</button>`:''}</span>
      <span class="amt">${zl(oamt(e))}<small>${KINDS[kd]}</small></span>
    </div>`; };
  if (f==='kosmetyki') {
    const have=list.filter(e=>e.inStock!==false), gone=list.filter(e=>e.inStock===false);
    return (have.length?`<h3 class="grouph">Na stanie (${have.length})</h3>`+have.map(rowH).join(''):'')
         + (gone.length?`<h3 class="grouph">Skończone (${gone.length})</h3>`+gone.map(rowH).join(''):'');
  }
  return list.map(rowH).join('');
}

// ---------- dialogs ----------
const dlg = $('#dlg');
function openDlg(title, body, footer, onSubmit){
  dlg.innerHTML = `<form class="dlg" novalidate><header><h3>${esc(title)}</h3><button type="button" class="x" aria-label="Zamknij" data-close>×</button></header>
    <div class="body">${body}</div>${footer!==null?`<footer>${footer}</footer>`:''}</form>`;
  const form = dlg.querySelector('form');
  form.addEventListener('submit', e=>{ e.preventDefault(); if (onSubmit && onSubmit(form)!==false) dlg.close(); });
  dlg.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dlg.close());
  dlg.showModal();
  const first = dlg.querySelector('.body input:not([type=hidden]), .body select');
  if (first && matchMedia('(pointer:fine)').matches) first.focus();
  return form;
}
const fld = (label,name,val,attrs='',cls='') => `<label class="f ${cls}"><span>${label}</span><input name="${name}" value="${esc(val??'')}" ${attrs}></label>`;
const nfld = (label,name,val,cls='') => fld(label,name,val==null?'':String(val).replace('.',','),'inputmode="decimal" autocomplete="off"',cls);
const footerStd = (del) => `${del?`<button type="button" class="danger" data-del>Usuń</button>`:''}<span class="spacer"></span><button type="button" class="ghost" data-close>Anuluj</button><button class="primary">Zapisz</button>`;
const notef = v => `<label class="f wide"><span>Notatki</span><textarea name="note" rows="2" placeholder="np. warsztat, gwarancja, co sprawdzić następnym razem">${esc(v||'')}</textarea></label>`;
const fv = (form,n) => { const el=form.elements[n]; return el ? el.value.trim() : ''; };

function vehicleDlg(v){
  const f = openDlg(v?'Edytuj auto':'Nowe auto', fld('Nazwa auta','name',v?.name,'required autocomplete="off" placeholder="np. Yaris"','wide') +
    (v?'':`<p class="hint">Auto dostanie od razu kategorie Serwis, Paliwo i Inne. Możesz je zmienić i dodać kolejne.</p>`),
    footerStd(!!v), form=>{
      const name=fv(form,'name'); if(!name){ toast('Wpisz nazwę auta.'); return false; }
      if (v) { v.name=name; touch(v); }
      else { const nv=newVehicle(name); state.vehicles.push(nv); ui.v=nv.id; ui.c=nv.cats[0].id; saveUI(); }
      commit();
    });
  const d=f.querySelector('[data-del]');
  if (d) d.onclick=()=>{ if(confirm(`Usunąć auto „${v.name}” razem ze wszystkimi wpisami?`)){ v.del=true; touch(v); dlg.close(); commit(); } };
}
function catDlg(v,c){
  const f = openDlg(c?'Edytuj kategorię':'Nowa kategoria',
    `<div class="grid">${fld('Nazwa kategorii','name',c?.name,'required autocomplete="off" placeholder="np. Ubezpieczenie"')}
     <label class="f"><span>Rodzaj wpisów</span><select name="type" ${c&&alive(c.entries).length?'disabled':''}>
      ${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${(c?c.type:'other')===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
     <p class="hint">Serwis: wizyta z listą części, kosztem serwisu i czasem. Paliwo: tankowania ze spalaniem. Inne: pojedyncze wydatki z rodzajem – części, serwis, myjnia i pielęgnacja albo kosmetyki (z oznaczeniem, czy jeszcze je masz).</p>`,
    footerStd(!!c), form=>{
      const name=fv(form,'name'); if(!name){ toast('Wpisz nazwę kategorii.'); return false; }
      if (c) { c.name=name; if(!form.elements.type.disabled) c.type=form.elements.type.value; touch(c); }
      else { const nc={id:uid(),u:Date.now(),name,type:form.elements.type.value,entries:[]}; v.cats.push(nc); ui.c=nc.id; saveUI(); }
      commit();
    });
  const d=f.querySelector('[data-del]');
  if (d) d.onclick=()=>{ if(confirm(`Usunąć kategorię „${c.name}” i wszystkie jej wpisy?`)){ c.del=true; touch(c); dlg.close(); commit(); } };
}

function planDlg(v,c,pl){
  const curKm=vehicleStats(v).maxKm;
  const f = openDlg(pl?'Edytuj plan':'Zaplanuj: '+c.name, `<div class="grid">
      ${fld('Co zrobić','title',pl?.title,`required autocomplete="off" placeholder="${c.type==='service'?'np. Wymiana oleju i filtrów':'np. Odnowienie OC, przegląd'}"`,'wide')}
      ${fld('Termin – data','dueDate',pl?.dueDate,'type="date"')}${nfld('Termin – przebieg (km)','dueKm',pl?.dueKm)}
      ${notef(pl?.note)}</div>
      <p class="hint">Wystarczy data albo przebieg. Jeśli podasz oba, zadanie zrobi się pilne przy tym, co nastąpi pierwsze.${curKm!=null?` Aktualny przebieg: ${kmf(curKm)}.`:''} Zadania na 14 dni lub 1000 km przed terminem są oznaczone jako „wkrótce”.</p>`,
    `${pl?`<button type="button" class="danger" data-del>Usuń</button><button type="button" class="ghost" data-doneonly>Zrobione bez wpisu</button>`:''}<span class="spacer"></span><button type="button" class="ghost" data-close>Anuluj</button><button class="primary">Zapisz</button>`,
    form=>{
      const d={ title:fv(form,'title'), dueDate:fv(form,'dueDate'), dueKm:num(fv(form,'dueKm')), note:fv(form,'note') };
      if (!d.title) { toast('Wpisz, co trzeba zrobić.'); return false; }
      if (!d.dueDate && d.dueKm==null) { toast('Podaj datę albo przebieg.'); return false; }
      if (pl) { Object.assign(pl,d); touch(pl); }
      else { if (!c.plans) c.plans=[]; c.plans.push({ id:uid(), u:Date.now(), ...d }); }
      commit(); toast(pl?'Plan zapisany.':'Zaplanowano.');
    });
  const del=f.querySelector('[data-del]');
  if (del) del.onclick=()=>{ if(confirm('Usunąć to zadanie?')){ pl.del=true; touch(pl); dlg.close(); commit(); } };
  const dn=f.querySelector('[data-doneonly]');
  if (dn) dn.onclick=()=>{ pl.done=true; pl.doneOn=today(); touch(pl); dlg.close(); commit(); toast('Oznaczono jako zrobione.'); };
}
function planDone(v,c,pl){
  const pre = c.type==='service'
    ? { parts:[{ co:pl.title }], note:pl.note||'' }
    : { co:pl.title, note:pl.note||'', kind: guessKind({co:pl.title}) || undefined };
  entryDlg(v,c,pre,pl);
}
function suggestions(v){
  const co=new Map();
  for (const c of alive(v.cats)) for (const e of alive(c.entries)) {
    if (c.type==='service') for (const p of (e.parts||[])) { if (p.co) co.set(p.co.toLowerCase(), {co:p.co, name:p.name, oem:p.oem, unit:partUnit(p), kind:'part'}); }
    else if (c.type==='other' && e.co) co.set(e.co.toLowerCase()+'|o', {co:e.co, name:e.name, okind:okind(e), kind:'other'});
  }
  return [...co.values()];
}

function partRow(p={}){
  return `<div class="prow">${fld('Co','co',p.co,'list="dlCo" autocomplete="off" placeholder="np. Filtr oleju"','c-co')}
    <button type="button" class="rm" aria-label="Usuń pozycję" title="Usuń pozycję">×</button>
    ${fld('Nazwa','nm',p.name,'autocomplete="off"','c-nm')}
    <label class="f c-oem"><span>Kod OEM</span><textarea name="oem" rows="1">${esc(p.oem||'')}</textarea></label>
    ${fld('Data zakupu','bought',p.bought,'type="date"','c-buy')}${nfld('Ilość','qty',p.co||p.name||p.cost!=null?partQty(p):1,'c-qty')}${nfld('Cena za szt.','unit',partUnit(p),'c-unit')}
    <div class="ptot"></div></div>`;
}

function entryDlg(v,c,e,fromPlan){
  const isNew=!e || !e.id; e = e || {};
  const sugg = suggestions(v);
  let body='', onSave;
  if (c.type==='service') {
    body = `<div class="grid">${fld('Data','date',e.date||today(),'type="date"')}${nfld('Przebieg (km)','km',e.km)}${nfld('Serwis koszt (robocizna)','labor',e.labor)}${fld('Wymiana czas (własny)','time',e.time,'autocomplete="off" placeholder="np. 1h"')}${notef(e.note)}</div>
      <p class="sectionlabel">Części i materiały</p><div class="prows" id="prows">${(e.parts&&e.parts.length?e.parts:[{}]).map(partRow).join('')}</div>
      <p><button type="button" class="ghost" id="addPart">+ Dodaj pozycję</button></p><div class="calc" id="scalc"></div>
      <datalist id="dlCo">${sugg.filter(s=>s.kind==='part').map(s=>`<option value="${esc(s.co)}">`).join('')}</datalist>
      <p class="hint">Po wybraniu „Co” z podpowiedzi nazwa, kod OEM i cena za sztukę uzupełnią się z ostatniego takiego wpisu. Koszt pozycji to ilość × cena za sztukę. Datę zakupu wpisz, jeśli część kupiłeś wcześniej niż serwis.</p>`;
    onSave = form=>{
      const parts=[...form.querySelectorAll('.prow')].map(r=>{ const qty=num(r.querySelector('[name=qty]').value)||1, unit=num(r.querySelector('[name=unit]').value);
          const p={ co:r.querySelector('[name=co]').value.trim(), name:r.querySelector('[name=nm]').value.trim(), oem:r.querySelector('[name=oem]').value.trim(), qty, unit, cost: unit!=null ? round2(qty*unit) : null };
          const bd=r.querySelector('[name=bought]').value; if (bd) p.bought=bd; return p; })
        .filter(p=>p.co||p.name||p.oem||p.unit!=null);
      return { date:fv(form,'date'), km:num(fv(form,'km')), labor:num(fv(form,'labor')), time:fv(form,'time'), note:fv(form,'note'), parts };
    };
  } else if (c.type==='fuel') {
    const tot = e.liters!=null&&e.price!=null ? round2(e.liters*e.price) : null;
    body = `<div class="grid">${fld('Data','date',e.date||today(),'type="date"')}${nfld('Przebieg (km)','km',e.km)}${nfld('Ilość litrów','liters',e.liters)}${nfld('Cena za litr','price',e.price)}${nfld('Kwota (zł)','total',tot)}${nfld('Spalanie z komputera','computer',e.computer)}</div>
      <div class="f octs"><span>Paliwo</span><div class="seg" role="radiogroup" aria-label="Oktany">${[95,98,100].map(o=>`<label><input type="radio" name="oct" value="${o}" ${fuelOct(e)===o?'checked':''}><span>${o}</span></label>`).join('')}</div></div>
      <div class="grid" style="margin-top:12px">${notef(e.note)}</div>
      <div class="calc" id="calc"></div>
      <p class="hint">Wpisz cenę za litr albo całą kwotę – drugie pole policzy się samo. Spalanie liczone jest jak w arkuszu: litry z tego tankowania na kilometry od poprzedniego. Wpis bez litrów to sam stan licznika (np. punkt startowy).</p>`;
    onSave = form=>({ date:fv(form,'date'), km:num(fv(form,'km')), liters:num(fv(form,'liters')), price:num(fv(form,'price')), computer:num(fv(form,'computer')), octane:Number(fv(form,'oct'))||95, note:fv(form,'note') });
  } else {
    const k0 = e.id ? okind(e) : (KINDS[ui.k] ? ui.k : 'czesci');
    body = `<div class="f"><span>Rodzaj kosztu</span><div class="seg seg4" role="radiogroup" aria-label="Rodzaj kosztu">${Object.entries(KINDS).map(([kk,l])=>`<label><input type="radio" name="kind" value="${kk}" ${k0===kk?'checked':''}><span>${l}</span></label>`).join('')}</div></div>
      <div class="grid" style="margin-top:12px">${fld('Data','date',e.date||today(),'type="date"')}${nfld('Koszt','amount',e.id?oamt(e):null)}${fld('Co','co',e.co,'list="dlCo" autocomplete="off" placeholder="np. Myjnia, Wosk, Przegląd"')}${fld('Nazwa / gdzie','name',e.name,'autocomplete="off"')}
      <label class="f wide chk" id="stockBox"><input type="checkbox" name="inStock" ${e.inStock===false?'':'checked'}><span>Mam jeszcze ten kosmetyk (na stanie)</span></label>
      ${notef(e.note)}</div>
      <datalist id="dlCo">${[...new Set(sugg.filter(s=>s.kind==='other').map(s=>s.co))].map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
      <p class="hint">Rodzaje: części kupione samodzielnie, serwis (przegląd, usługa warsztatu), myjnia i pielęgnacja (myjnia, detailing, ceramika), kosmetyki (szampony, woski, płyny – z oznaczeniem, czy jeszcze je masz).</p>`;
    onSave = form=>{
      const kind = fv(form,'kind') || 'czesci';
      const d = { date:fv(form,'date'), co:fv(form,'co'), name:fv(form,'name'), kind, amount:num(fv(form,'amount')), note:fv(form,'note'), cost:undefined, service:undefined };
      d.inStock = kind==='kosmetyki' ? form.elements.inStock.checked : undefined;
      return d;
    };
  }
  const title = (fromPlan?'Zrobione: ':isNew?'Nowy wpis: ':'Edytuj wpis: ')+(fromPlan?fromPlan.title:c.name);
  const form = openDlg(title, body, footerStd(!isNew), form=>{
    const data = onSave(form);
    if (isNew) { const n={ id:uid(), u:Date.now(), ...data }; for (const k in n) if (n[k]===undefined) delete n[k]; c.entries.push(n); }
    else { Object.assign(e, data); for (const k in e) if (e[k]===undefined) delete e[k]; touch(e); }
    if (fromPlan) { fromPlan.done=true; fromPlan.doneOn=today(); touch(fromPlan); }
    commit(); toast(fromPlan?'Wpis dodany, zadanie zrobione.':isNew?'Wpis dodany.':'Zmiany zapisane.');
  });
  const d=form.querySelector('[data-del]');
  if (d) d.onclick=()=>{ if(confirm('Usunąć ten wpis?')){ e.del=true; touch(e); dlg.close(); commit(); toast('Wpis usunięty.'); } };

  if (c.type==='service') {
    const box=form.querySelector('#prows');
    form.querySelector('#addPart').onclick=()=>{ box.insertAdjacentHTML('beforeend',partRow()); box.lastElementChild.querySelector('input').focus(); };
    box.addEventListener('click',ev=>{ const b=ev.target.closest('.rm'); if(b){ b.closest('.prow').remove(); if(!box.children.length) box.insertAdjacentHTML('beforeend',partRow()); } });
    const scalc=form.querySelector('#scalc');
    const supd=()=>{ let sum=0;
      box.querySelectorAll('.prow').forEach(r=>{ const q=num(r.querySelector('[name=qty]').value)||1, u=num(r.querySelector('[name=unit]').value);
        const t=r.querySelector('.ptot'); if(u!=null){ sum+=q*u; t.innerHTML=`Koszt <b>${zl(round2(q*u))}</b>`; } else t.textContent=''; });
      const lab=num(form.elements.labor.value)||0;
      scalc.innerHTML=`Części razem <b>${zl(round2(sum))}</b>, z serwisem <b>${zl(round2(sum+lab))}</b>`; };
    form.addEventListener('input',supd); box.addEventListener('click',()=>setTimeout(supd)); supd();
    box.addEventListener('change',ev=>{
      if (ev.target.name!=='co') return;
      const s = sugg.find(x=>x.kind==='part' && x.co.toLowerCase()===ev.target.value.trim().toLowerCase()); if(!s) return;
      const row=ev.target.closest('.prow');
      const nm=row.querySelector('[name=nm]'), oem=row.querySelector('[name=oem]');
      if(!nm.value && s.name) nm.value=s.name; if(!oem.value && s.oem) oem.value=s.oem; const un=row.querySelector('[name=unit]'); if(!un.value && s.unit!=null){ un.value=String(s.unit).replace('.',','); un.dispatchEvent(new Event('input',{bubbles:true})); }
    });
  }
  if (c.type==='other') {
    const box=form.querySelector('#stockBox'); let touched=!!e.id;
    const vis=()=>{ box.hidden = fv(form,'kind')!=='kosmetyki'; };
    form.querySelectorAll('[name=kind]').forEach(r=>r.addEventListener('change',()=>{ touched=true; vis(); }));
    form.elements.co.addEventListener('change',()=>{
      if (touched) return;
      const val=fv(form,'co').toLowerCase();
      const hit=sugg.find(x=>x.kind==='other' && x.co.toLowerCase()===val);
      const kk = hit ? hit.okind : guessKind({co:val});
      if (kk) { const r=form.querySelector(`[name=kind][value="${kk}"]`); if (r) r.checked=true; vis(); }
      if (hit && !form.elements.name.value && hit.name) form.elements.name.value=hit.name;
    });
    vis();
  }
  if (c.type==='fuel') {
    const L=form.elements.liters, P=form.elements.price, T=form.elements.total, K=form.elements.km, calc=form.querySelector('#calc');
    const rows = fuelRows(c.entries.filter(x=>x!==e));
    const upd=()=>{
      const km=num(K.value), l=num(L.value);
      const prev = rows.filter(r=>r.e.km!=null && km!=null && r.e.km<km).pop();
      const diff = prev ? km-prev.e.km : null;
      const parts=[];
      if (num(T.value)!=null) parts.push(`Koszt <b>${zl(num(T.value))}</b>`);
      if (diff!=null) parts.push(`od poprzedniego <b>${diff.toLocaleString('pl-PL')} km</b>`);
      if (diff>0 && l>0) parts.push(`spalanie <b>${dec(l/diff*100)} l/100 km</b>`);
      calc.innerHTML = parts.join(', ') || 'Wpisz przebieg i litry, a pokażę koszt i spalanie.';
    };
    L.addEventListener('input',()=>{ const l=num(L.value),p=num(P.value); if(l!=null&&p!=null) T.value=String(round2(l*p)).replace('.',','); upd(); });
    P.addEventListener('input',()=>{ const l=num(L.value),p=num(P.value); if(l!=null&&p!=null) T.value=String(round2(l*p)).replace('.',','); upd(); });
    T.addEventListener('input',()=>{ const l=num(L.value),t=num(T.value); if(l>0&&t!=null) P.value=String(Math.round(t/l*1000)/1000).replace('.',','); upd(); });
    K.addEventListener('input',upd); upd();
  }
}

// ---------- sync (GitHub Gist) ----------
let syncing=false, pending=false, syncTimer=null, lastSync=null, syncErr=null;
function setSync(kind, txt){ $('#syncDot').className='dot '+kind; $('#syncTxt').textContent=txt; }
function refreshSyncLabel(){
  if (!cfg.token) return setSync('','Tylko lokalnie');
  if (syncing) return setSync('busy','Synchronizuję…');
  if (syncErr) return setSync('err','Błąd synchronizacji');
  if (lastSync) return setSync('ok','Zsynchronizowano '+lastSync.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}));
  setSync('','Połączono z gistem');
}
function scheduleSync(){ if(!cfg.token) return; clearTimeout(syncTimer); syncTimer=setTimeout(sync,1200); }
async function gh(method, path, body){
  const res = await fetch('https://api.github.com'+path, { method, cache:'no-store',
    headers:{ 'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json', ...(body?{'Content-Type':'application/json'}:{}) },
    body: body?JSON.stringify(body):undefined });
  if (!res.ok) {
    let msg = res.status===401 ? 'GitHub odrzucił token. Sprawdź, czy jest aktualny i ma uprawnienie do gistów.'
      : res.status===404 ? 'Nie znaleziono gista. Sprawdź ID albo zostaw pole puste.'
      : res.status===403 ? 'Brak uprawnień albo limit zapytań GitHuba. Spróbuj za chwilę.' : 'GitHub zwrócił błąd '+res.status+'.';
    throw new Error(msg);
  }
  return res.status===204 ? null : res.json();
}
async function findOrCreateGist(){
  for (let page=1; page<=5; page++) {
    const list = await gh('GET','/gists?per_page=100&page='+page);
    const g = list.find(x=>x.files && x.files[FILE_NAME]);
    if (g) return g.id;
    if (list.length<100) break;
  }
  const g = await gh('POST','/gists',{ description:'Garaż – koszty pojazdów (dane aplikacji)', public:false, files:{ [FILE_NAME]:{ content: JSON.stringify(state) } } });
  return g.id;
}
async function sync(){
  if (!cfg.token) return;
  if (syncing) { pending=true; return; }
  syncing=true; syncErr=null; refreshSyncLabel();
  try {
    if (!cfg.gistId) { cfg.gistId = await findOrCreateGist(); writeJSON(LS_CFG,cfg); }
    const g = await gh('GET','/gists/'+cfg.gistId);
    const f = g.files && g.files[FILE_NAME];
    let remote = emptyState();
    if (f) {
      let txt = f.content;
      if (f.truncated) txt = await (await fetch(f.raw_url,{cache:'no-store'})).text();
      try { remote = JSON.parse(txt||'{}'); if(!remote.vehicles) remote=emptyState(); } catch { remote = emptyState(); }
    }
    const merged = mergeState(state, remote);
    const ms = JSON.stringify(merged);
    if (ms !== JSON.stringify(remote)) await gh('PATCH','/gists/'+cfg.gistId,{ files:{ [FILE_NAME]:{ content: ms } } });
    if (ms !== JSON.stringify(state)) { state = merged; writeJSON(LS_DATA,state); if (!dlg.open) render(); }
    lastSync = new Date();
  } catch(e) { syncErr = e.message; }
  finally {
    syncing=false; refreshSyncLabel();
    if (pending) { pending=false; sync(); }
  }
}

function syncDlg(){
  const connected = !!cfg.token;
  const f = openDlg('Synchronizacja', `
    <div class="status-line"><span class="dot ${syncErr?'err':connected?'ok':''}"></span><span>${syncErr?esc(syncErr):connected?`Połączono z gistem ${esc(cfg.gistId||'')}`:'Dane są tylko na tym urządzeniu.'}</span></div>
    <div class="grid">${fld('Token GitHuba','token',cfg.token,'type="password" autocomplete="off" spellcheck="false" placeholder="ghp_… lub github_pat_…"','wide')}
    ${fld('ID gista (opcjonalnie)','gist',cfg.gistId,'autocomplete="off" spellcheck="false" placeholder="zostaw puste – znajdę lub utworzę"','wide')}</div>
    <ol class="steps">
      <li>Wejdź na <a href="https://github.com/settings/tokens/new?scopes=gist&description=Garaz%20-%20koszty%20pojazdow" target="_blank" rel="noopener">github.com/settings/tokens</a> i utwórz token (classic) z zaznaczonym tylko uprawnieniem <b>gist</b>.</li>
      <li>Wklej go tutaj i kliknij „Połącz”. Aplikacja znajdzie swój prywatny gist albo go utworzy.</li>
      <li>Na każdym kolejnym urządzeniu wklej ten sam token – dane scalą się automatycznie.</li>
    </ol>
    <p class="hint">Token jest zapisany tylko w przeglądarce na tym urządzeniu. Gist jest prywatny (niepubliczny), ale każdy, kto zna jego link, może go odczytać.</p>`,
    `${connected?`<button type="button" class="danger" data-off>Rozłącz</button>`:''}<span class="spacer"></span>${connected?`<button type="button" class="ghost" data-now>Synchronizuj teraz</button>`:''}<button class="primary">Połącz</button>`,
    form=>{
      const t=fv(form,'token'), g=fv(form,'gist');
      if (!t) { toast('Wklej token GitHuba.'); return false; }
      cfg={ token:t, gistId: g ? g.replace(/^.*\//,'') : '' }; writeJSON(LS_CFG,cfg); syncErr=null; lastSync=null;
      sync().then(()=>toast(syncErr?syncErr:'Połączono. Synchronizacja włączona.'));
    });
  const off=f.querySelector('[data-off]');
  if (off) off.onclick=()=>{ if(confirm('Rozłączyć to urządzenie? Dane zostaną lokalnie, ale przestaną się synchronizować.')){ cfg={}; writeJSON(LS_CFG,cfg); syncErr=null; lastSync=null; refreshSyncLabel(); dlg.close(); } };
  const now=f.querySelector('[data-now]');
  if (now) now.onclick=()=>{ dlg.close(); sync().then(()=>toast(syncErr||'Zsynchronizowano.')); };
}

// ---------- Excel ----------
let excelPromise=null;
function loadExcel(){
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (!excelPromise) excelPromise = new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload=()=>res(window.ExcelJS); s.onerror=()=>{ excelPromise=null; rej(new Error('Nie udało się wczytać modułu Excela. Sprawdź połączenie z internetem.')); };
    document.head.appendChild(s);
  });
  return excelPromise;
}
async function exportXlsx(){
  try {
    if (!alive(state.vehicles).length) return toast('Najpierw dodaj auto.');
    const ExcelJS = await loadExcel();
    const wb = new ExcelJS.Workbook(); wb.creator='Garaż';
    for (const sh of buildSpec(state, today())) {
      const ws = wb.addWorksheet(sh.name, { views:[{ state:'frozen', ySplit:1 }] });
      ws.columns = sh.widths.map(w=>({ width:w }));
      sh.rows.forEach((row,ri)=>{ (row||[]).forEach((cell,ci)=>{
        if (!cell) return;
        const c = ws.getCell(ri+1, ci+1);
        if (cell.f) c.value = { formula:cell.f, result:cell.r };
        else if (cell.t==='date') { const [y,m,d]=cell.v.split('-').map(Number); c.value = new Date(Date.UTC(y,m-1,d)); }
        else c.value = cell.v;
        if (cell.fmt) c.numFmt = cell.fmt;
        c.font = { name:'Arial', size:10, bold:!!cell.b };
        c.alignment = { vertical:'middle', horizontal: cell.t==='date' ? 'left' : undefined, wrapText:!!cell.wrap };
        if (cell.fill) c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:cell.fill } };
      }); });
      for (const m of sh.merges) ws.mergeCells(m);
    }
    const buf = await wb.xlsx.writeBuffer();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=`Pojazdy - Koszta ${today()}.xlsx`; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('Arkusz pobrany.');
  } catch(e){ toast(e.message); }
}
function normX(v){
  if (v===null || v===undefined) return null;
  if (v instanceof Date) return v;
  if (typeof v==='object') {
    if ('result' in v) return normX(v.result);
    if (v.richText) return v.richText.map(t=>t.text).join('');
    if ('text' in v) return v.text;
    return null;
  }
  if (typeof v==='string' && v.trim()==='') return null;
  return v;
}
async function importXlsx(file){
  try {
    const ExcelJS = await loadExcel();
    const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
    const sheets = wb.worksheets.map(ws=>({ name:ws.name, rows:ws.rowCount, cols:ws.columnCount, cell(r,c){
      const x=ws.getCell(r,c); const slave = x.isMerged && x.master.address!==x.address; const master = x.isMerged && !slave;
      const v = slave ? null : normX(x.value); return { v, mv: slave ? normX(x.master.value) : v, slave, master };
    }}));
    const parsed = parseSheets(sheets);
    if (!parsed.length) return toast('Nie znalazłem w pliku arkuszy z kosztami.');
    const lines = parsed.map(p=>`• ${p.vehicle} – ${p.cat}: ${p.entries.length} wpis(ów)`).join('\n');
    if (!confirm(`Wczytać dane z arkusza?\n\n${lines}\n\nKategorie o tych samych nazwach zostaną zastąpione danymi z pliku.`)) return;
    const t=Date.now();
    for (const p of parsed) {
      let v = alive(state.vehicles).find(x=>x.name.toLowerCase()===p.vehicle.toLowerCase());
      if (!v) { v = newVehicle(p.vehicle); state.vehicles.push(v); }
      let c = alive(v.cats).find(x=>x.name.toLowerCase()===p.cat.toLowerCase())
           || alive(v.cats).find(x=>x.type===p.type && !alive(x.entries).length && Object.values(TYPES).includes(x.name));
      if (!c) { c={ id:uid(), u:t, name:p.cat, type:p.type, entries:[] }; v.cats.push(c); }
      for (const e of c.entries) if (!e.del) { e.del=true; e.u=t; }
      c.name=p.cat; c.type=p.type; c.u=t;
      c.entries.push(...p.entries);
    }
    commit(); toast('Dane z arkusza wczytane.');
  } catch(e){ toast('Nie udało się wczytać pliku: '+e.message); }
}
function dataDlg(){
  openDlg('Excel i kopie danych', `<div class="menu">
    <button type="button" data-a="exp">Eksportuj do Excela<span>Arkusz w układzie jak dotąd: osobna zakładka dla każdego auta i kategorii, plus podsumowanie.</span></button>
    <button type="button" data-a="imp">Wczytaj arkusz Excela<span>Przeniesie wpisy z Twojego dotychczasowego pliku .xlsx (zakładki „Auto - Kategoria”).</span></button>
    <button type="button" data-a="jexp">Pobierz kopię zapasową (.json)<span>Pełna kopia danych aplikacji.</span></button>
    <button type="button" data-a="jimp">Wczytaj kopię zapasową (.json)<span>Scali kopię z obecnymi danymi.</span></button></div>`, null);
  dlg.querySelector('.menu').onclick=ev=>{
    const a=ev.target.closest('[data-a]')?.dataset.a; if(!a) return; dlg.close();
    if (a==='exp') exportXlsx();
    if (a==='imp') $('#fileXlsx').click();
    if (a==='jimp') $('#fileJson').click();
    if (a==='jexp') { const b=new Blob([JSON.stringify(state,null,1)],{type:'application/json'}); const l=document.createElement('a'); l.href=URL.createObjectURL(b); l.download=`garaz-kopia-${today()}.json`; document.body.appendChild(l); l.click(); setTimeout(()=>{URL.revokeObjectURL(l.href); l.remove();},2000); }
  };
}

// ---------- events ----------
document.addEventListener('keydown', ev=>{
  const t=ev.target; if ((ev.key==='Enter'||ev.key===' ') && t.matches && t.matches('div[data-entry],div[data-plan]')) { ev.preventDefault(); t.click(); }
});
document.addEventListener('click', ev=>{
  const sb = ev.target.closest('[data-stock]');
  if (sb && !dlg.contains(sb)) {
    const v=curVehicle(), c=v&&curCat(v), e=c&&c.entries.find(x=>x.id===sb.dataset.stock);
    if (e) { e.inStock = e.inStock===false; touch(e); commit(); toast(e.inStock?'Oznaczono: na stanie.':'Oznaczono: skończony.'); }
    return;
  }
  const pd = ev.target.closest('[data-plandone]');
  if (pd && !dlg.contains(pd)) { const v=curVehicle(), c=curCat(v), pl=alive(c.plans).find(x=>x.id===pd.dataset.plandone); if (pl) planDone(v,c,pl); return; }
  const t = ev.target.closest('[data-veh],[data-cat],[data-act],[data-entry],[data-kind],[data-plan],[data-gocat],#addVeh');
  if (!t || dlg.contains(t)) return;
  const v = curVehicle(), c = v && curCat(v);
  if (t.id==='addVeh') return vehicleDlg(null);
  if (t.dataset.veh) { ui.v=t.dataset.veh; ui.c=null; saveUI(); return render(); }
  if (t.dataset.cat) { ui.c=t.dataset.cat; saveUI(); return render(); }
  if (t.dataset.kind) { ui.k=t.dataset.kind; saveUI(); return render(); }
  if (t.dataset.gocat) { ui.c=t.dataset.gocat; saveUI(); render(); document.querySelector('.tabs')?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if (t.dataset.plan) { const pl=alive(c.plans).find(x=>x.id===t.dataset.plan); if (pl) planDlg(v,c,pl); return; }
  if (t.dataset.entry) { const e=c.entries.find(x=>x.id===t.dataset.entry); if(e) entryDlg(v,c,e); return; }
  const a=t.dataset.act;
  if (a==='addVeh') vehicleDlg(null);
  if (a==='importX') $('#fileXlsx').click();
  if (a==='editVeh') vehicleDlg(v);
  if (a==='addCat') catDlg(v,null);
  if (a==='editCat') catDlg(v,c);
  if (a==='addEntry') entryDlg(v,c,null);
  if (a==='addPlan') planDlg(v,c,null);
});
$('#syncBtn').onclick = syncDlg;
$('#dataBtn').onclick = dataDlg;
$('#fileXlsx').onchange = e=>{ const f=e.target.files[0]; e.target.value=''; if(f) importXlsx(f); };
$('#fileJson').onchange = async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try { const d=JSON.parse(await f.text()); if(!Array.isArray(d.vehicles)) throw new Error('to nie jest kopia z tej aplikacji');
    state = mergeState(state,d); commit(); toast('Kopia wczytana.'); } catch(err){ toast('Nie udało się wczytać kopii: '+err.message); }
};
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') sync(); });
window.addEventListener('online', sync);
setInterval(()=>{ if (document.visibilityState==='visible') sync(); }, 60000);
window.addEventListener('storage', ev=>{ if (ev.key===LS_DATA) { state=readJSON(LS_DATA,emptyState()); render(); } });

render(); refreshSyncLabel(); sync();
