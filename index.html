let excelPromise=null;
function loadExcel(){
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (!excelPromise) excelPromise = new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload=()=>res(window.ExcelJS); s.onerror=()=>{ excelPromise=null; rej(new Error('Nie udało się wczytać modułu Excela. Sprawdź połączenie z internetem.')); };
    document.head.appendChild(s);
  });
  return excelPromise;
}
async function exportXlsx(){
  try {
    if (!alive(state.vehicles).length) return toast('Najpierw dodaj auto.');
    const ExcelJS = await loadExcel();
    const wb = new ExcelJS.Workbook(); wb.creator='Garaż';
    for (const sh of buildSpec(state, today())) {
      const ws = wb.addWorksheet(sh.name, { views:[{ state:'frozen', ySplit:1 }] });
      ws.columns = sh.widths.map(w=>({ width:w }));
      sh.rows.forEach((row,ri)=>{ (row||[]).forEach((cell,ci)=>{
        if (!cell) return;
        const c = ws.getCell(ri+1, ci+1);
        if (cell.f) c.value = { formula:cell.f, result:cell.r };
        else if (cell.t==='date') { const [y,m,d]=cell.v.split('-').map(Number); c.value = new Date(Date.UTC(y,m-1,d)); }
        else c.value = cell.v;
        if (cell.fmt) c.numFmt = cell.fmt;
        c.font = { name:'Arial', size:10, bold:!!cell.b };
        c.alignment = { vertical:'middle', horizontal: cell.t==='date' ? 'left' : undefined, wrapText:!!cell.wrap };
        if (cell.fill) c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:cell.fill } };
      }); });
      for (const m of sh.merges) ws.mergeCells(m);
    }
    const buf = await wb.xlsx.writeBuffer();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=`Pojazdy - Koszta ${today()}.xlsx`; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('Arkusz pobrany.');
  } catch(e){ toast(e.message); }
}
function normX(v){
  if (v===null || v===undefined) return null;
  if (v instanceof Date) return v;
  if (typeof v==='object') {
    if ('result' in v) return normX(v.result);
    if (v.richText) return v.richText.map(t=>t.text).join('');
    if ('text' in v) return v.text;
    return null;
  }
  if (typeof v==='string' && v.trim()==='') return null;
  return v;
}
async function importXlsx(file){
  try {
    const ExcelJS = await loadExcel();
    const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
    const sheets = wb.worksheets.map(ws=>({ name:ws.name, rows:ws.rowCount, cols:ws.columnCount, cell(r,c){
      const x=ws.getCell(r,c); const slave = x.isMerged && x.master.address!==x.address; const master = x.isMerged && !slave;
      const v = slave ? null : normX(x.value); return { v, mv: slave ? normX(x.master.value) : v, slave, master };
    }}));
    const parsed = parseSheets(sheets);
    if (!parsed.length) return toast('Nie znalazłem w pliku arkuszy z kosztami.');
    const lines = parsed.map(p=>`• ${p.vehicle} – ${p.cat}: ${p.entries.length} wpis(ów)`).join('\n');
    if (!confirm(`Wczytać dane z arkusza?\n\n${lines}\n\nKategorie o tych samych nazwach zostaną zastąpione danymi z pliku.`)) return;
    const t=Date.now();
    for (const p of parsed) {
      let v = alive(state.vehicles).find(x=>x.name.toLowerCase()===p.vehicle.toLowerCase());
      if (!v) { v = newVehicle(p.vehicle); state.vehicles.push(v); }
      let c = alive(v.cats).find(x=>x.name.toLowerCase()===p.cat.toLowerCase())
           || alive(v.cats).find(x=>x.type===p.type && !alive(x.entries).length && Object.values(TYPES).includes(x.name));
      if (!c) { c={ id:uid(), u:t, name:p.cat, type:p.type, entries:[] }; v.cats.push(c); }
      for (const e of c.entries) if (!e.del) { e.del=true; e.u=t; }
      c.name=p.cat; c.type=p.type; c.u=t;
      c.entries.push(...p.entries);
    }
    commit(); toast('Dane z arkusza wczytane.');
  } catch(e){ toast('Nie udało się wczytać pliku: '+e.message); }
}
function dataDlg(){
  openDlg('Excel, kopie i kosz', `<div class="menu">
    <button type="button" data-a="exp">Eksportuj do Excela<span>Arkusz w układzie jak dotąd: osobna zakładka dla każdego auta i kategorii, plus podsumowanie.</span></button>
    <button type="button" data-a="imp">Wczytaj arkusz Excela<span>Przeniesie wpisy z Twojego dotychczasowego pliku .xlsx (zakładki „Auto - Kategoria”).</span></button>
    <button type="button" data-a="jexp">Pobierz kopię zapasową (.json)<span>Pełna kopia danych aplikacji.</span></button>
    <button type="button" data-a="jimp">Wczytaj kopię zapasową (.json)<span>Scali kopię z obecnymi danymi.</span></button>
    <button type="button" data-a="trash">Kosz<span>Przywróć przypadkowo usunięte auta, kategorie, wpisy i plany.</span></button></div>`, null);
  dlg.querySelector('.menu').onclick=ev=>{
    const a=ev.target.closest('[data-a]')?.dataset.a; if(!a) return; dlg.close();
    if (a==='exp') exportXlsx();
    if (a==='imp') $('#fileXlsx').click();
    if (a==='jimp') $('#fileJson').click();
    if (a==='trash') trashDlg();
    if (a==='jexp') { const b=new Blob([JSON.stringify(state,null,1)],{type:'application/json'}); const l=document.createElement('a'); l.href=URL.createObjectURL(b); l.download=`garaz-kopia-${today()}.json`; document.body.appendChild(l); l.click(); setTimeout(()=>{URL.revokeObjectURL(l.href); l.remove();},2000); }
  };
}

// ---------- events ----------
document.addEventListener('keydown', ev=>{
  const t=ev.target; if ((ev.key==='Enter'||ev.key===' ') && t.matches && t.matches('div[data-entry],div[data-plan],div[data-tire],div[data-swap]')) { ev.preventDefault(); t.click(); }
});
document.addEventListener('click', ev=>{
  const sb = ev.target.closest('[data-stock]');
  if (sb && !dlg.contains(sb)) {
    const v=curVehicle(), c=v&&curCat(v), e=c&&c.entries.find(x=>x.id===sb.dataset.stock);
    if (e) { e.inStock = e.inStock===false; touch(e); commit(); toast(e.inStock?'Oznaczono: na stanie.':'Oznaczono: skończony.'); }
    return;
  }
  const pd = ev.target.closest('[data-plandone]');
  if (pd && !dlg.contains(pd)) { const v=curVehicle(), c=curCat(v), pl=alive(c.plans).find(x=>x.id===pd.dataset.plandone); if (pl) planDone(v,c,pl); return; }
  const t = ev.target.closest('[data-veh],[data-cat],[data-act],[data-entry],[data-kind],[data-plan],[data-gocat],[data-period],[data-tire],[data-swap],#addVeh');
  if (!t || dlg.contains(t)) return;
  const v = curVehicle(), c = v && curCat(v);
  if (t.id==='addVeh') return vehicleDlg(null);
  if (t.dataset.veh) { ui.v=t.dataset.veh; ui.c=null; saveUI(); return render(); }
  if (t.dataset.cat) { ui.c=t.dataset.cat; saveUI(); return render(); }
  if (t.dataset.kind) { ui.k=t.dataset.kind; saveUI(); return render(); }
  if (t.dataset.period) { ui.p=t.dataset.period; saveUI(); return render(); }
  if (t.dataset.tire) { const x=alive(v.tires).find(y=>y.id===t.dataset.tire); if (x) tireDlg(v,x); return; }
  if (t.dataset.swap) { const x=alive(v.tswaps).find(y=>y.id===t.dataset.swap); if (x) swapDlg(v,x); return; }
  if (t.dataset.gocat) { ui.c=t.dataset.gocat; saveUI(); render(); document.querySelector('.tabs')?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if (t.dataset.plan) { const pl=alive(c.plans).find(x=>x.id===t.dataset.plan); if (pl) planDlg(v,c,pl); return; }
  if (t.dataset.entry) { const e=c.entries.find(x=>x.id===t.dataset.entry); if(e) entryDlg(v,c,e); return; }
  const a=t.dataset.act;
  if (a==='addVeh') vehicleDlg(null);
  if (a==='importX') $('#fileXlsx').click();
  if (a==='editVeh') vehicleDlg(v);
  if (a==='addCat') catDlg(v,null);
  if (a==='editCat') catDlg(v,c);
  if (a==='addEntry') entryDlg(v,c,null);
  if (a==='addPlan') planDlg(v,c,null);
  if (a==='odo') odoDlg(v);
  if (a==='addTire') tireDlg(v,null);
  if (a==='swap') swapDlg(v,null);
  if (a==='editInfo') infoDlg(v);
  if (a==='toggleArch') { ui.arch=!ui.arch; saveUI(); render(); }
});
$('#syncBtn').onclick = syncDlg;
$('#searchBtn').onclick = searchDlg;
$('#dataBtn').onclick = dataDlg;
$('#fileXlsx').onchange = e=>{ const f=e.target.files[0]; e.target.value=''; if(f) importXlsx(f); };
$('#fileJson').onchange = async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try { const d=JSON.parse(await f.text()); if(!Array.isArray(d.vehicles)) throw new Error('to nie jest kopia z tej aplikacji');
    state = mergeState(state,d); commit(); toast('Kopia wczytana.'); } catch(err){ toast('Nie udało się wczytać kopii: '+err.message); }
};
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') sync(); });
window.addEventListener('online', sync);
let rzT; window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if (!dlg.open) render(); }, 250); });
setInterval(()=>{ if (document.visibilityState==='visible') sync(); }, 60000);
window.addEventListener('storage', ev=>{ if (ev.key===LS_DATA) { state=readJSON(LS_DATA,emptyState()); render(); } });

render(); refreshSyncLabel(); sync();
</script>
</body>
</html>
